<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Testing JavaScript</title>

    <!--Adds interactvity, Runs code according to certain events, Has a powerful API (Application
    Programming Interface).hence acces to comples features-->

    <!--Runs on JVM (Javascript virtual machine): it helps write and execute scripts
    e.g all browsers come with a type of JVM.-->

    <style>
        button {
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            cursor: pointer;
            width: 10%;
        }
    </style>
</head>
<body>  
    <button>Click Me</button>

    <script>
        //Get access to the button
        const button = document.querySelector('button');

        //Add event listener to the button
        button.addEventListener('click', showMyName);

        //Function to show my name
        function showMyName() {
            alert('I like pineapples and cakes');
        }

    </script>
    
</body>
</html>
